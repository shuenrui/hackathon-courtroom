<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent Hackathon 2026 — Judging Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>

<svg class="hexfield" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <polygon points="1350,-170 977,45 977,475 1350,690 1723,475 1723,45" fill="#101010" stroke="#101010" stroke-width="90" stroke-linejoin="round"/>
  <polygon points="1050,710 816,845 816,1115 1050,1250 1284,1115 1284,845" fill="#0E0E0E" stroke="#0E0E0E" stroke-width="70" stroke-linejoin="round"/>
</svg>

<div id="stage">

  <header class="head">
    <div class="lockup">
      <img class="lk lk-devin" src="assets/devin.png" alt="Devin">
      <span class="lk-rule"></span>
      <span class="lk-claw">
        <img class="lk lk-clawimg" src="assets/claw.png" alt="Claw Collective">
        <span class="lk-prev mono">prev. OpenClaw KL</span>
      </span>
      <span class="lk-rule"></span>
      <img class="lk lk-qwen" src="assets/qwen.webp" alt="Qwen">
    </div>

    <div class="head-main">
      <div class="head-left">
        <p class="h-kicker mono">JUDGING SESSION / 23.08.26</p>
        <h1 class="h-case" id="head-case">TEAM 1 — REHEARSAL RAYA</h1>
      </div>
      <div class="head-right">
        <p class="h-team mono" id="head-team">CASE T01</p>
        <p class="h-line" id="head-oneliner"></p>
      </div>
    </div>
  </header>

  <div class="chat-scroll" id="chat-scroll">
    <div class="chat-col" id="chat-col">
      <div class="bigplay" id="bigplay">
        <button class="bigplay-btn mono" id="btn-bigplay">▶&nbsp;&nbsp;PLAY JUDGING SESSION</button>
        <p class="bigplay-note mono">15 MESSAGES / VOICED REPLAY / SCORES SEALED</p>
      </div>
    </div>
  </div>

  <footer class="bar mono">
    <button id="btn-play" class="bar-btn bar-btn-main">▶ PLAY</button>
    <button id="btn-restart" class="bar-btn">⟲ RESTART</button>
    <button id="btn-skipcase" class="bar-btn">SKIP CASE →</button>
    <span class="bar-progress" id="bar-progress">READY</span>
    <span class="bar-voice" id="bar-voice">VOICE / READY</span>
    <span class="bar-spacer"></span>
    <button id="btn-mute" class="bar-btn">MUTE</button>
    <button id="btn-full" class="bar-btn">FULLSCREEN</button>
    <span class="bar-clock" id="bar-clock">--:--</span>
  </footer>

</div>
<script src="app.js?v=19"></script>
</body>
</html>
